{% load formutils %}


<nav aria-label="breadcrumb" class="w-full mb-4">
	<ol class="flex h-8 space-x-2">
		<li class="flex items-center">
            {%  icon 'home' %}
		</li>
        {% for breadcrumb in breadcrumbs %}
            <li class="flex items-center space-x-2">
                {%  icon 'chevron-right' 'w-4' %}
                {% if breadcrumb.url %}
			        <a rel="noopener noreferrer" href="{{ breadcrumb.url }}" class="flex items-center hover:underline">{{ breadcrumb.label }}</a>
                {% else %}
                    <div class="space-x-2 underline">{{ breadcrumb.label }}</div>
                {% endif %}
		    </li>
        {% endfor %}
	</ol>
</nav>
